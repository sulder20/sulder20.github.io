&lt;script&gt;
    // 页面加载时初始化倒计时
    document.addEventListener(&#39;DOMContentLoaded&#39;, function() &#123;
        // 设置初始倒计时时间（60分钟）
        let secondsRemaining = 3600;
        const timerElement = document.getElementById(&#39;timer&#39;);
        
        // 更新倒计时显示
        function updateTimer() &#123;
            const hours = Math.floor(secondsRemaining / 3600);
            const minutes = Math.floor((secondsRemaining % 3600) / 60);
            const seconds = secondsRemaining % 60;
            
            timerElement.textContent = `$&#123;hours.toString().padStart(2, &#39;0&#39;)&#125;:$&#123;minutes.toString().padStart(2, &#39;0&#39;)&#125;:$&#123;seconds.toString().padStart(2, &#39;0&#39;)&#125;`;
            
            if (secondsRemaining &gt; 0) &#123;
                secondsRemaining--;
                setTimeout(updateTimer, 1000);
            &#125; else &#123;
                timerElement.textContent = &quot;时间结束!&quot;;
                timerElement.style.backgroundColor = &quot;rgba(229, 57, 53, 0.3)&quot;;
                timerElement.style.borderColor = &quot;#e53935&quot;;
            &#125;
        &#125;
        
        updateTimer();
        
        // 提交按钮事件
        const submitBtn = document.getElementById(&#39;submit-btn&#39;);
        submitBtn.addEventListener(&#39;click&#39;, function() &#123;
            // 禁用提交按钮防止重复提交
            submitBtn.disabled = true;
            submitBtn.textContent = &quot;正在评卷中...&quot;;
            
            // 模拟评卷过程
            setTimeout(showResults, 2000);
        &#125;);
        
        // 重新测试按钮
        const restartBtn = document.getElementById(&#39;restart-btn&#39;);
        restartBtn.addEventListener(&#39;click&#39;, function() &#123;
            location.reload();
        &#125;);
    &#125;);
    
    // 显示成绩结果
    function showResults() &#123;
        const resultSection = document.getElementById(&#39;result-section&#39;);
        
        // 计算选择题得分
        const choiceScore = calculateChoiceScore();
        
        // 计算填空题得分
        const fillScore = calculateFillScore();
        
        // 计算总分
        const totalScore = choiceScore + fillScore;
        
        // 显示分数
        document.getElementById(&#39;score-choice&#39;).textContent = choiceScore;
        document.getElementById(&#39;score-fill&#39;).textContent = fillScore;
        document.getElementById(&#39;total-score&#39;).textContent = totalScore;
        
        // 生成答题详情
        generateAnswerDetails(choiceScore, fillScore);
        
        // 显示结果区域
        resultSection.style.display = &#39;block&#39;;
        
        // 滚动到结果区域
        resultSection.scrollIntoView(&#123;behavior: &#39;smooth&#39;&#125;);
        
        // 更新按钮状态
        document.getElementById(&#39;submit-btn&#39;).textContent = &quot;试卷已提交&quot;;
    &#125;
    
    // 计算选择题得分
    function calculateChoiceScore() &#123;
        let score = 0;
        
        for (let i = 1; i &lt;= 25; i++) &#123;
            const questionName = `q$&#123;i&#125;`;
            const selectedAnswer = document.querySelector(`input[name=&quot;$&#123;questionName&#125;&quot;]:checked`);
            
            // 这里应该有正确答案判断逻辑
            // 实际应用中应根据正确答案判断
            if (selectedAnswer) &#123;
                // 假设每题2分，选中即得分（实际应判断是否正确）
                score += 2;
            &#125;
        &#125;
        
        return score;
    &#125;
    
    // 计算填空题得分
    function calculateFillScore() &#123;
        let score = 0;
        
        // 这里应该有正确答案判断逻辑
        // 实际应用中应根据正确答案判断
        for (let i = 1; i &lt;= 10; i++) &#123;
            const input = document.getElementById(`f$&#123;i&#125;`);
            if (input &amp;&amp; input.value.trim() !== &quot;&quot;) &#123;
                // 假设每题1分，填写即得分（实际应判断是否正确）
                score += 1;
            &#125;
        &#125;
        
        return score;
    &#125;
    
    // 生成答题详情
    function generateAnswerDetails(choiceScore, fillScore) &#123;
        const answersDetails = document.getElementById(&#39;answers-details&#39;);
        let detailsHTML = &#39;&#39;;
        
        // 选择题详情
        detailsHTML += `&lt;div class=&quot;answer-item&quot;&gt;
            &lt;div class=&quot;question-text&quot;&gt;选择题答题情况&lt;/div&gt;
            &lt;div class=&quot;user-answer&quot;&gt;得分: $&#123;choiceScore&#125;/50&lt;/div&gt;
            &lt;div class=&quot;correct-answer&quot;&gt;$&#123;choiceScore &gt;= 40 ? &#39;对魔域世界观有深刻理解&#39; : &#39;基础理解尚可，部分关键概念需加强&#39;&#125;&lt;/div&gt;
        &lt;/div&gt;`;
        
        // 填空题详情
        detailsHTML += `&lt;div class=&quot;answer-item&quot;&gt;
            &lt;div class=&quot;question-text&quot;&gt;填空题答题情况&lt;/div&gt;
            &lt;div class=&quot;user-answer&quot;&gt;得分: $&#123;fillScore&#125;/20&lt;/div&gt;
            &lt;div class=&quot;correct-answer&quot;&gt;$&#123;fillScore &gt;= 16 ? &#39;术语使用精准，细节把握到位&#39; : &#39;部分核心术语理解需深化&#39;&#125;&lt;/div&gt;
        &lt;/div&gt;`;
        
        // 总分评价
        const totalScore = choiceScore + fillScore;
        let evaluation = &#39;&#39;;
        
        if (totalScore &gt;= 60) &#123;
            evaluation = &#39;✦ 魔域智慧圣使 ✦&lt;br&gt;您已达到魅域高级学者认证标准&#39;;
        &#125; else if (totalScore &gt;= 45) &#123;
            evaluation = &#39;✦ 合格魔道学者 ✦&lt;br&gt;您具备良好的魔域世界观理解&#39;;
        &#125; else if (totalScore &gt;= 30) &#123;
            evaluation = &#39;✦ 魔法学徒 ✦&lt;br&gt;基础概念已掌握，但需深化理解&#39;;
        &#125; else &#123;
            evaluation = &#39;✦ 觉醒期探索者 ✦&lt;br&gt;请重新学习核心概念&#39;;
        &#125;
        
        detailsHTML += `&lt;div class=&quot;answer-item&quot; style=&quot;background: rgba(130, 50, 200, 0.3);&quot;&gt;
            &lt;div class=&quot;question-text&quot;&gt;综合评价&lt;/div&gt;
            &lt;div class=&quot;user-answer&quot; style=&quot;color: #fff59d;&quot;&gt;总成绩: $&#123;totalScore&#125;/70&lt;/div&gt;
            &lt;div class=&quot;correct-answer&quot;&gt;$&#123;evaluation&#125;&lt;/div&gt;
        &lt;/div&gt;`;
        
        answersDetails.innerHTML = detailsHTML;
    &#125;
&lt;/script&gt;
